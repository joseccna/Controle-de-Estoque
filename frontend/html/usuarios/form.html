<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Usuário</title>
    <link rel="stylesheet" href="../../css/global.css">
    <script src="../../js/config.js"></script>
    <script src="../../js/auth.js" defer></script>
    <script src="../../js/login.js" defer></script>
    <script src="../../js/usuarios/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Controle de Estoque</h1>
        <div>
            <nav>
                <a href="../../index.html">Home</a>
                <a href="../produtos/index.html">Produtos</a>
                <a href="../fornecedores/index.html">Fornecedores</a>
                <a href="../formaspagamento/index.html">Formas de Pagamento</a>
                <a href="../contasreceber/index.html">Contas a Receber</a>
                <a href="../pedidos/index.html">Pedidos</a>
                <a href="../usuarios/index.html">Usuários</a>
            </nav>
            <button onclick="logout()">Sair</button>
        </div>
    </header>

    <main>
        <h2 id="titulo-pagina">Novo Usuário</h2>
        
        <form id="form-usuario">
            <label for="perfil">Perfil do Usuário:</label>
            <select id="perfil" required>
                <option value="Cliente">Cliente</option>
                <option value="Caixa">Caixa</option>
                <option value="Gerente">Gerente</option>
            </select>

            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha">

            <div id="campo-cpf">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" maxlength="14">
            </div>

            <div id="campo-turno" style="display: none;">
                <label for="turno">Turno:</label>
                <input type="text" id="turno">
            </div>

            <div id="campo-setor" style="display: none;">
                <label for="setor">Setor:</label>
                <input type="text" id="setor">
            </div>

            <button type="submit">Salvar</button>
            <a href="index.html">Cancelar</a>
            <p id="feedback-message"></p>
        </form>
    </main>
</body>
</html>
