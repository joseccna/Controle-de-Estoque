<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Produto</title>
    <link rel="stylesheet" href="../../css/global.css">
    <script src="../../js/config.js"></script>
    <script src="../../js/carrinho-store.js" defer></script>
    <script src="../../js/auth.js" defer></script>
    <script src="../../js/login.js" defer></script>
    <script src="../../js/produtos/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Controle de Estoque</h1>
        <div>
            <nav>
                <a href="../../index.html">Home</a>
                <a href="../produtos/index.html">Produtos</a>
                <a href="../fornecedores/index.html">Fornecedores</a>
                <a href="../formaspagamento/index.html">Formas de Pagamento</a>
                <a href="../contasreceber/index.html">Contas a Receber</a>
                <a href="../pedidos/index.html">Pedidos</a>
                <a href="../carrinho/index.html">Carrinho (<span id="cart-count">0</span>)</a>
                <a href="../usuarios/index.html">Usuários</a>
            </nav>
            <button onclick="logout()">Sair</button>
        </div>
    </header>

    <main>
        <h2 id="titulo-pagina">Novo Produto</h2>
        
        <form id="form-produto">
            <label for="nome">Nome do Produto:</label>
            <input type="text" id="nome" required>

            <label for="preco">Preço:</label>
            <input type="number" id="preco" step="0.01" required>

            <label for="quantidadeEstoque">Quantidade em Estoque:</label>
            <input type="number" id="quantidadeEstoque" required>

            <label for="imagemUrl">URL da Imagem (opcional):</label>
            <input type="url" id="imagemUrl" placeholder="https://exemplo.com/imagem.jpg">

            <label for="fornecedorId">Fornecedor:</label>
            <select id="fornecedorId" required>
                <option value="">Selecione um fornecedor</option>
            </select>

            <button type="submit">Salvar</button>
            <a href="index.html">Cancelar</a>
            <p id="feedback-message"></p>
        </form>
    </main>
</body>
</html>
