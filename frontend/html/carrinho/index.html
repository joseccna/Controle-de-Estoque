<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de Compras</title>
    <link rel="stylesheet" href="../../css/global.css">
    <script src="../../js/config.js"></script>
    <script src="../../js/carrinho-store.js" defer></script>
    <script src="../../js/auth.js" defer></script>
    <script src="../../js/login.js" defer></script>
    <script src="../../js/carrinho/index.js" defer></script>
</head>
<body>
    <header>
        <h1>Controle de Estoque</h1>
        <div>
            <nav>
                <a href="../../index.html">Home</a>
                <a href="../produtos/index.html">Produtos</a>
                <a href="../fornecedores/index.html">Fornecedores</a>
                <a href="../formaspagamento/index.html">Formas de Pagamento</a>
                <a href="../contasreceber/index.html">Contas a Receber</a>
                <a href="../pedidos/index.html">Pedidos</a>
                <a href="../carrinho/index.html">Carrinho (<span id="cart-count">0</span>)</a>
                <a href="../usuarios/index.html">Usuários</a>
            </nav>
            <button onclick="logout()">Sair</button>
        </div>
    </header>

    <main>
        <h2>Meu Carrinho de Compras</h2>
        <p id="feedback-message"></p>

        <table id="tabela-carrinho-container">
            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Preço Unitário</th>
                    <th>Quantidade</th>
                    <th>Subtotal</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-carrinho"></tbody>
        </table>

        <div id="carrinho-resumo" style="margin-top: 1.5rem;">
            <h3>Total: R$ <span id="total-carrinho">0,00</span></h3>
            
            <form id="form-finalizar-pedido" style="margin-top: 1rem;">
                <label for="formaPagamentoId">Forma de Pagamento:</label>
                <select id="formaPagamentoId" required>
                    <option value="">Selecione uma forma de pagamento</option>
                </select>

                <br>
                <button type="submit" id="btn-gravar-pedido">Gravar Pedido</button>
                <button type="button" onclick="limparEAtualizar()">Esvaziar Carrinho</button>
            </form>
        </div>
    </main>
</body>
</html>
